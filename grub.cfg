# ZevOS GRUB fallback configuration.
set timeout=5
set default=0

# OVMF/UEFI exposes a GOP mode to GRUB. Keep a conservative graphics mode
# instead of asking GRUB to discover an unsupported "auto" mode.
set gfxmode=640x480
set gfxpayload=keep

menuentry "ZevOS" {
    multiboot2 /boot/kernel.elf
    boot
}
