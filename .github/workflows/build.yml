name: Build ZevOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc binutils nasm grub-common grub-pc-bin xorriso mtools

      - name: Build ISO
        run: make

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: zevos-iso
          path: os.iso
